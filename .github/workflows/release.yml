# DM Bank shared Module release workflow (SPEC §13). Keep this file identical in every Module repo.
# Push a tag vX.Y.Z (stable) or vX.Y.Z-proto.N (Prototype Build, published as a pre-release).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version into module.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" '.version = $v' module.json > module.json.tmp
          mv module.json.tmp module.json
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build module.zip (module.json at the root, no Zip64)
        run: |
          rm -f module.zip
          # -fz- forbids Zip64; -X drops extra file attributes; -D skips directory entries.
          zip -r -X -D -9 -fz- module.zip . \
            -x ".git*" ".git/*" ".github/*" "node_modules/*" "src/*" \
               "build.mjs" "package.json" "package-lock.json" \
               "*.bak" "*.map" ".DS_Store" "*/.DS_Store" "Thumbs.db" ".vscode/*" ".idea/*" \
               "module.zip"
          unzip -l module.zip | grep -qE '[[:space:]]module\.json$' || { echo "module.json missing at zip root"; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          : > notes.md
          if [ -f CHANGELOG.md ]; then
            BASE="${VERSION%%-*}"
            awk -v v="$VERSION" -v b="$BASE" '
              /^## / { if (found) exit; h=$0; sub(/^## +/, "", h); split(h, w, /[ \t]/);
                       if (w[1] == v || w[1] == b) { found=1; next } }
              found { print }' CHANGELOG.md > notes.md
          fi
          [ -s notes.md ] || echo "Release $TAG" > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          if [[ "$TAG" == *-proto* ]]; then FLAGS+=(--prerelease); else FLAGS+=(--latest); fi
          gh release create "$TAG" module.json module.zip \
            --title "$TAG" --notes-file notes.md --verify-tag "${FLAGS[@]}"
